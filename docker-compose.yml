# ============================================================
# Realtime Streaming Pipeline — Docker Compose
# ============================================================
# Usage:
#   docker-compose up -d          — start all services
#   docker-compose down -v        — stop and remove volumes
#   docker-compose logs -f kafka  — follow kafka logs
# ============================================================

services:

  # --------------------------------------------------------
  # Zookeeper — Kafka metadata management
  # --------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/commands/ruok || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Kafka — Message broker
  # --------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_MS: 604800000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Kafka Init — Create crypto topics on startup
  # --------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo '=========================================='
        echo 'Creating crypto Kafka topics...'
        echo '=========================================='
        kafka-topics --create --if-not-exists --topic crypto-trades     --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --create --if-not-exists --topic crypto-indicators --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --create --if-not-exists --topic crypto-alerts     --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        echo ''
        echo '=========================================='
        echo 'Topics created successfully:'
        kafka-topics --list --bootstrap-server kafka:9092
        echo '=========================================='
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Flink JobManager — Orchestrates Flink jobs
  # --------------------------------------------------------
  jobmanager:
    image: flink:1.19-scala_2.12
    container_name: flink-jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 5000
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./stream-processing:/opt/flink/usrlib
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Flink TaskManager — Executes tasks
  # --------------------------------------------------------
  taskmanager:
    image: flink:1.19-scala_2.12
    container_name: flink-taskmanager
    hostname: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./stream-processing:/opt/flink/usrlib
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Redis — Fast in-memory counter store
  # --------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Elasticsearch — Time-series analytics store
  # --------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=streaming-cluster
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Kibana — Visualization dashboard
  # --------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.13
    container_name: kibana
    hostname: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Producer — Python crypto event generator
  # --------------------------------------------------------
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
      network: host
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      NUM_SHARDS: "2"
      HEALTH_PORT: "8080"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)\"" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Stream Processing — Python consumers (Redis sync)
  # --------------------------------------------------------
  stream-processing:
    build:
      context: ./stream-processing
      dockerfile: Dockerfile
      network: host
    container_name: stream-processing
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
      ES_HOST: http://elasticsearch:9200
    restart: unless-stopped
    networks:
      - streaming-net

  # --------------------------------------------------------
  # ML Service — Python predictor for AI forecasting
  # --------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
      network: host
    container_name: ml-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    restart: unless-stopped
    networks:
      - streaming-net

  # --------------------------------------------------------
  # Web Dashboard — FastAPI + Static frontend
  # --------------------------------------------------------
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
      network: host
    container_name: web-dashboard
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    volumes:
      - ./web-dashboard/backend:/app/backend
      - ./web-dashboard/frontend:/app/frontend
    environment:
      REDIS_HOST: redis
      ES_HOST: http://elasticsearch:9200
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - streaming-net

# ============================================================
# Volumes
# ============================================================
volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  flink-checkpoints:
  flink-savepoints:
  redis-data:
  es-data:

    # ============================================================
    # Networks
    # ============================================================
networks:
  streaming-net:
    driver: bridge
    name: streaming-pipeline-net
